[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-profiling-mcp"
version = "0.1.0"
description = "New isolated MCP server for the Skill Profiling ReAct Agent (Phase 3: MCP infrastructure only)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1",
]

[project.scripts]
skill-profiling-mcp = "skill_profiling_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["skill_profiling_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "docker: integration tests requiring a real Docker daemon and network access",
]
